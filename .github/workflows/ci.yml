name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Pin Python to project version
        run: uv python install 3.11

      - name: Lint
        run: uv run --group dev ruff check .

      - name: Test
        run: uv run --group dev pytest -v
