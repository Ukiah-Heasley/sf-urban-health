[project]
name = "sf-urban-health"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests==2.32.3",
    "boto3==1.34.162",
    "python-dotenv==1.0.1",
]

[dependency-groups]
airflow = [
    "apache-airflow==2.9.3",
    "apache-airflow-providers-snowflake==5.6.1",
    "apache-airflow-providers-amazon==8.25.0",
]
dbt = [
    "dbt-core==1.9.0",
    "dbt-snowflake==1.9.0",
]
dashboard = [
    "dash==2.18.1",
    "dash-bootstrap-components==1.6.0",
    "plotly==5.24.1",
    "polars==1.12.0",
    "pyarrow==17.0.0",
    "snowflake-connector-python[pandas]==3.12.3",
    "gunicorn==23.0.0",
]
dev = [
    "pytest==8.3.2",
    "ruff==0.5.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["airflow", "airflow/include"]