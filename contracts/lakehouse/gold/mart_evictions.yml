version: 1
layer: gold
name: mart_evictions
owner: analytics-engineering
description: >-
  Monthly eviction notice counts by neighborhood, supervisor district, and
  eviction type, aligned with the current mart_evictions grain.
grain:
  - filed_month
  - neighborhood
  - supervisor_district
  - eviction_type
path_template: lake/parquet/gold/mart_evictions/build_date={build_date}/
partition_columns:
  - build_date
columns:
  - name: filed_month
    type: date
    nullable: false
    description: First day of the month the eviction notices were filed.
  - name: neighborhood
    type: string
    nullable: false
    description: Normalized neighborhood name.
  - name: supervisor_district
    type: string
    nullable: true
    description: SF Supervisor district.
  - name: eviction_type
    type: string
    nullable: false
    description: Derived no_fault or at_fault classification.
  - name: eviction_count
    type: integer
    nullable: false
    description: Total eviction notices filed in the group.
  - name: ellis_act_count
    type: integer
    nullable: true
    description: Notices with the Ellis Act withdrawal flag set.
  - name: owner_move_in_count
    type: integer
    nullable: true
    description: Notices with the owner move-in flag set.
  - name: non_payment_count
    type: integer
    nullable: true
    description: Notices with the non-payment flag set.
quality:
  checks:
    - name: unique_grain
      type: unique
      columns:
        - filed_month
        - neighborhood
        - supervisor_district
        - eviction_type
    - name: accepted_eviction_type
      type: accepted_values
      columns:
        - eviction_type
      values:
        - at_fault
        - no_fault
compatibility:
  additive: true
  version_policy: semver
