# Pre-commit hooks for the sf-urban-health project.
#
# CI runs the same hooks (`pre-commit run --all-files`) — keep this file as
# the single source of truth for lint/format scope and args.
#
# Stages:
#   default (runs on `git commit`): fast mechanical checks only.
#   manual: dbt-parse + dbt-checkpoint conventions — opt-in; warn-only in CI.
#
# Performance notes:
#   - SQLFluff uses the dbt templater (slow); lint-only on commit, no fix hook.
#     Run `sqlfluff fix dbt/models` locally when you want auto-fixes.
#   - dbt-checkpoint is manual-only so it never blocks commits or slows CI lint.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: ^(airflow/include/dbt/|dbt/dbt_packages/|dbt/target/)
      - id: end-of-file-fixer
        exclude: ^(airflow/include/dbt/|dbt/dbt_packages/|dbt/target/)
      - id: trailing-whitespace
        exclude: ^(airflow/include/dbt/|dbt/dbt_packages/|dbt/target/)
      - id: check-added-large-files
        args: ['--maxkb=512']
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.2.5
    hooks:
      - id: sqlfluff-lint
        additional_dependencies:
          - dbt-core==1.9.0
          - dbt-snowflake==1.9.0
          - sqlfluff-templater-dbt==3.2.5
        files: ^dbt/(models|tests|analyses)/.*\.sql$

  # dbt-parse regenerates target/manifest.json so dbt-checkpoint hooks see
  # the latest model graph. Uses the project's venv via `language: system`
  # (activate .venv before running manual hooks locally).
  - repo: local
    hooks:
      - id: docs-check
        name: current-state documentation audit
        entry: uv run --group dev python .codex/skills/maintain-project-docs/scripts/audit_docs.py
        language: system
        pass_filenames: false
        always_run: true

      - id: dbt-parse
        name: dbt parse (refresh manifest)
        entry: bash -c 'cd dbt && uv run --group dbt dbt parse --profiles-dir .'
        language: system
        pass_filenames: false
        stages: [manual]
        always_run: true

  - repo: https://github.com/dbt-checkpoint/dbt-checkpoint
    rev: v2.0.9
    hooks:
      - id: check-model-has-description
        stages: [manual]
      - id: check-model-columns-have-desc
        stages: [manual]
      - id: check-script-semicolon
        stages: [manual]
      - id: check-script-has-no-table-name
        stages: [manual]
      - id: check-source-has-description
        stages: [manual]
      - id: check-source-columns-have-desc
        stages: [manual]
      - id: check-model-has-tests
        args: [--test-cnt, "1"]
        stages: [manual]
      - id: check-model-has-tests-by-type
        args: [--tests, "schema=1"]
        stages: [manual]
