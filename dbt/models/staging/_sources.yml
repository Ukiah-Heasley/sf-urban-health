version: 2

sources:
  - name: raw
    database: SF_URBAN_HEALTH
    schema: RAW
    description: "Raw JSON loaded from S3 by Airflow ingestion DAGs."
    tables:
      - name: permits
        description: "SF Department of Building Inspection permit records (DataSF i98e-djp9)."
        loaded_at_field: _loaded_at
        freshness:
          warn_after: { count: 36, period: hour }
          error_after: { count: 72, period: hour }
      - name: incidents
        description: "SF Police Department incident reports (DataSF wg3w-h783)."
        loaded_at_field: _loaded_at
        freshness:
          warn_after: { count: 36, period: hour }
          error_after: { count: 72, period: hour }