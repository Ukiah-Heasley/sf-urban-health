version: 2

models:
  - name: stg_transcript_chunks
    description: "One row per agenda-item chunk extracted from BOS meeting minutes PDFs."
    columns:
      - name: chunk_id
        description: "Stable identifier, e.g. bos_2026_03_15_item_4. Grain of this model."
        tests:
          - not_null
          - unique
      - name: meeting_date
        tests:
          - not_null
      - name: meeting_type
        description: "Source body: board_of_supervisors, planning_commission, etc."
        tests:
          - not_null
      - name: agenda_item
        description: "Item number within the meeting. Null for preamble/unstructured sections."
      - name: text
        description: "Full discussion text for the chunk."
        tests:
          - not_null
      - name: source_url
        description: "URL of the source PDF."
