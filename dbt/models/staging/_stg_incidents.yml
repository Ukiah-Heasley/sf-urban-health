version: 2

models:
  - name: stg_incidents
    description: "One row per SF Police Department incident report, typed and renamed from the raw JSON payload."
    columns:
      - name: row_id
        description: "DataSF unique row identifier. Grain of this model."
        tests:
          - not_null
          - unique
      - name: incident_number
        description: "SFPD report number — may span multiple incident codes within one report."
        tests:
          - not_null
      - name: incident_at
        description: "Timestamp the incident occurred."
      - name: incident_category
        description: "Top-level incident category (e.g. Larceny Theft, Assault)."
      - name: incident_subcategory
        description: "More specific classification within the category."
      - name: resolution
        description: "Case resolution status (e.g. Open or Active, Cite or Arrest Adult)."
      - name: police_district
        description: "SFPD district where the incident occurred."
      - name: neighborhood
        description: "Neighborhood from DataSF analysis boundaries."
      - name: supervisor_district
        description: "SF Supervisor district where the incident occurred."
      - name: latitude
        description: "WGS84 latitude of incident location."
      - name: longitude
        description: "WGS84 longitude of incident location."
