version: 2

models:
  - name: stg_incidents
    description: "One row per SF Police Department incident report, typed and renamed from the raw JSON payload."
    columns:
      - name: row_id
        description: "DataSF unique row identifier. Grain of this model."
        tests:
          - not_null
          - unique
      - name: incident_id
        description: "DataSF incident identifier (shared across rows of the same incident)."
      - name: incident_number
        description: "SFPD report number — may span multiple incident codes within one report."
        tests:
          - not_null
      - name: cad_number
        description: "Computer-Aided Dispatch number, when the incident originated from a dispatched call."
      - name: report_type_code
        description: "Code for how the report was filed (e.g. initial, supplement)."
      - name: report_type
        description: "Human-readable report type description."
      - name: filed_online
        description: "True if the report was filed online by the public."
      - name: incident_at
        description: "Timestamp the incident occurred."
      - name: incident_date
        description: "Date the incident occurred."
      - name: incident_time
        description: "Time-of-day the incident occurred (HH:MM string from DataSF)."
      - name: incident_year
        description: "Year the incident occurred."
      - name: incident_day_of_week
        description: "Day of week the incident occurred (e.g. Monday)."
      - name: reported_at
        description: "Timestamp the incident was reported to SFPD."
      - name: incident_code
        description: "Granular SFPD incident code."
      - name: incident_category
        description: "Top-level incident category (e.g. Larceny Theft, Assault)."
      - name: incident_subcategory
        description: "More specific classification within the category."
      - name: incident_description
        description: "Free-text description of the incident code."
      - name: resolution
        description: "Case resolution status (e.g. Open or Active, Cite or Arrest Adult). Null when not recorded."
      - name: intersection
        description: "Nearest intersection to the incident location."
      - name: police_district
        description: "SFPD district where the incident occurred."
      - name: neighborhood
        description: "Neighborhood from DataSF analysis boundaries (raw; normalized in marts)."
      - name: supervisor_district
        description: "SF Supervisor district where the incident occurred (string; may be null)."
      - name: latitude
        description: "WGS84 latitude of the incident location."
      - name: longitude
        description: "WGS84 longitude of the incident location."
      - name: _loaded_at
        description: "Timestamp the raw record was loaded into Snowflake (audit column)."
