version: 2

models:
  - name: int_incident_timelines
    description: "Incident records enriched with derived time and resolution fields. Source for all public-safety marts."
    columns:
      - name: row_id
        description: "DataSF unique row identifier (primary key)."
        tests:
          - not_null
          - unique
      - name: normalized_neighborhood
        description: "Neighborhood name normalized via normalize_neighborhood macro."
      - name: hour_of_day
        description: "Hour extracted from incident_at (0–23)."
      - name: time_bucket
        description: "Morning (6–11) / Afternoon (12–16) / Evening (17–20) / Night bucketed from hour_of_day."
      - name: day_type
        description: "Weekday or Weekend derived from incident_day_of_week."
      - name: report_lag_hours
        description: "Hours between incident_at and reported_at. Null when either timestamp is absent."
      - name: resolution_status
        description: "Case resolution with DataSF nulls coalesced to 'Unknown' (DataSF leaves resolution null for both genuinely open and not-yet-recorded cases)."
      - name: is_resolved
        description: "True only when the case reached a real resolution — not 'Open or Active' and not 'Unknown'. Never null."
      - name: incident_month
        description: "First day of the month of incident_date. Grain key for the mart."
