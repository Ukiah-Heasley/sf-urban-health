version: 2

models:
  - name: int_permit_timelines
    description: "Permit lifecycle timings and derived metrics. Used by all housing marts."
    columns:
      - name: permit_number
        description: "DBI-issued permit identifier (primary key)."
        tests:
          - not_null
          - unique
      - name: days_to_issue
        description: "Calendar days from filed_at to issued_at."
      - name: days_issue_to_complete
        description: "Calendar days from issued_at to completed_at."
      - name: days_total
        description: "Calendar days from filed_at to completed_at."
      - name: net_units_added
        description: "Proposed units minus existing units. Negative indicates demolition."
      - name: lifecycle_stage
        description: "Latest stage: filed, issued, or completed."
