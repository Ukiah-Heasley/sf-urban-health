version: 2

models:
  - name: mart_public_safety
    description: "Monthly incident counts by neighborhood, district, and category. BI-ready."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - incident_month
            - neighborhood
            - supervisor_district
            - police_district
            - incident_category
    columns:
      - name: incident_month
        description: "First day of the month the incidents occurred."
        tests:
          - not_null
      - name: neighborhood
        description: "Normalized neighborhood (via normalize_neighborhood macro)."
        tests:
          - not_null
      - name: supervisor_district
        description: "SF Supervisor district."
      - name: police_district
        description: "SFPD operational district."
      - name: incident_category
        description: "Top-level incident category (e.g. Larceny Theft, Assault)."
      - name: total_incidents
        description: "Count of all incidents in this group."
        tests:
          - not_null
      - name: resolved_count
        description: "Incidents that reached a real resolution (not open, not unknown)."
      - name: open_count
        description: "Incidents explicitly marked 'Open or Active'."
      - name: unknown_count
        description: "Incidents with no resolution recorded (DataSF null)."
      - name: avg_report_lag_hours
        description: "Average hours between incident occurrence and report filing. Nulls excluded."
      - name: morning_incidents
        description: "Incidents occurring 06:00–11:59."
      - name: afternoon_incidents
        description: "Incidents occurring 12:00–16:59."
      - name: evening_incidents
        description: "Incidents occurring 17:00–20:59."
      - name: night_incidents
        description: "Incidents occurring 21:00–05:59."
