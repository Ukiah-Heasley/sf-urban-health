version: 2

models:
  - name: mart_permit_pipeline
    description: "Daily snapshot of in-flight residential permits grouped by neighborhood, district, lifecycle stage, and age bucket. Shows processing backlog and stall points."
    columns:
      - name: neighborhood
        description: "Normalized neighborhood name."
        tests:
          - not_null
      - name: supervisor_district
        description: "SF Board of Supervisors district."
      - name: lifecycle_stage
        description: "Current stage: filed or issued."
        tests:
          - not_null
          - accepted_values:
              values: ['filed', 'issued']
      - name: age_bucket
        description: "Time since filing: <90d, 90-180d, 180-365d, or >365d."
        tests:
          - not_null
          - accepted_values:
              values: ['<90d', '90-180d', '180-365d', '>365d']
      - name: snapshot_date
        description: "Date this snapshot was computed (current_date at build time)."
        tests:
          - not_null
      - name: permit_count
        description: "Number of in-flight permits in this bucket."
        tests:
          - not_null
      - name: proposed_units
        description: "Sum of proposed residential units across in-flight permits."
      - name: avg_days_in_stage
        description: "Average calendar days since filing for permits in this bucket."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - neighborhood
            - supervisor_district
            - lifecycle_stage
            - age_bucket
