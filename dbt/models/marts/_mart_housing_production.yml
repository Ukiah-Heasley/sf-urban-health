version: 2

models:
  - name: mart_housing_production
    description: "Monthly housing permit activity by neighborhood and supervisor district, ready for BI consumption."
    columns:
      - name: filed_month
        tests:
          - not_null
      - name: neighborhood
        description: "Normalized neighborhood name (see normalize_neighborhood macro)."
        tests:
          - not_null
      - name: permits_filed
        tests:
          - not_null
      - name: net_units_added
        description: "Proposed minus existing units. Negative values indicate demolitions."
      - name: use_transition
        description: "Type of structural change (see int_permit_timelines for values)."
      - name: avg_cost_per_unit
        description: "Average project cost per net unit added. Null for rows with no unit gains."
      - name: median_cost_per_unit
        description: "Median project cost per net unit added. Null for rows with no unit gains."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - filed_month
            - neighborhood
            - supervisor_district
            - use_transition
