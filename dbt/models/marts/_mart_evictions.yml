version: 2

models:
  - name: mart_evictions
    description: "Monthly eviction notice counts by neighborhood, supervisor district, and eviction type (at-fault vs no-fault)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - filed_month
            - neighborhood
            - supervisor_district
            - eviction_type
    columns:
      - name: filed_month
        description: "First day of the month the eviction notices were filed."
        tests:
          - not_null
      - name: neighborhood
        description: "Normalized neighborhood name."
        tests:
          - not_null
      - name: supervisor_district
        description: "SF Supervisor district (1–11) as a string, or null if geocoding failed."
      - name: eviction_type
        description: "'no_fault' or 'at_fault', derived from reason flags in stg_evictions."
        tests:
          - not_null
          - accepted_values:
              values: ["at_fault", "no_fault"]
      - name: eviction_count
        description: "Total eviction notices filed in this month/neighborhood/district/type."
        tests:
          - not_null
      - name: ellis_act_count
        description: "Notices with the Ellis Act withdrawal flag set."
      - name: owner_move_in_count
        description: "Notices with the owner move-in flag set."
      - name: non_payment_count
        description: "Notices with the non-payment flag set."
