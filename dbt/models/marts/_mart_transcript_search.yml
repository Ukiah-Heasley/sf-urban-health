version: 2

models:
  - name: mart_transcript_search
    description: "Semantic-search surface for BOS meeting minutes. Queried by rag/retriever.py."
    columns:
      - name: chunk_id
        tests:
          - not_null
          - unique
      - name: meeting_date
        tests:
          - not_null
      - name: embedding
        description: "768-dim Cortex embedding. Use VECTOR_COSINE_SIMILARITY for retrieval."
