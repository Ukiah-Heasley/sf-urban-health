version: 2

models:
  - name: stg_airflow_dag_runs
    description: "Cleaned Airflow DAG run metadata from METADATA.AIRFLOW_DAG_RUNS."
    columns:
      - name: run_id
        description: "Airflow dag_run_id — unique per run."
        tests:
          - not_null
          - unique
      - name: dag_id
        tests:
          - not_null
      - name: run_date
        tests:
          - not_null
      - name: state
        tests:
          - not_null
          - accepted_values:
              values: ['success', 'failed', 'running', 'queued']

  - name: stg_airflow_task_instances
    description: "Cleaned Airflow task instance metadata from METADATA.AIRFLOW_TASK_INSTANCES."
    columns:
      - name: dag_id
        tests:
          - not_null
      - name: run_id
        tests:
          - not_null
      - name: task_id
        tests:
          - not_null

  - name: mart_pipeline_health
    description: "Daily DAG run health metrics — success rates, durations, records ingested."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [run_date, dag_id]
    columns:
      - name: run_date
        tests:
          - not_null
      - name: dag_id
        tests:
          - not_null
      - name: total_runs
        tests:
          - not_null
      - name: success_rate_pct
        tests:
          - not_null

  - name: mart_dbt_test_health
    description: "dbt test results per run with rolling pass rates."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [run_date, run_id, test_name]
    columns:
      - name: run_date
        tests:
          - not_null
      - name: test_name
        tests:
          - not_null
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['pass', 'fail', 'error', 'warn']

  - name: mart_pipeline_summary
    description: "Per-DAG rolling 7d/30d summary for the engineer health dashboard."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [dag_id]
    columns:
      - name: dag_id
        tests:
          - not_null
      - name: success_rate_7d
        tests:
          - not_null
      - name: last_run_status
        tests:
          - not_null
          - accepted_values:
              values: ['healthy', 'degraded', 'failing']

  - name: mart_data_trust
    description: "Per-dataset freshness and trust score for the analyst dashboard."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [dataset_name]
    columns:
      - name: dataset_name
        tests:
          - not_null
      - name: freshness_status
        tests:
          - not_null
          - accepted_values:
              values: ['fresh', 'stale', 'critical']
      - name: trust_status
        tests:
          - not_null
          - accepted_values:
              values: ['trusted', 'degraded', 'untrusted']
